name = "afacs-reservations"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Non-secret vars (set real values here or in the dashboard).
# Secrets are set with `wrangler secret put NAME`:
#   RESEND_API_KEY   — Resend API key (email)
#   MAPBOX_TOKEN     — Mapbox token (geocoding + map). A public/restricted token is fine.
#   ADMIN_PASSWORD   — password for the /admin CRM dashboard (single user: Matt)
#   ANET_API_LOGIN_ID     — Authorize.net API Login ID
#   ANET_TRANSACTION_KEY  — Authorize.net Transaction Key (NEVER in frontend code)
#   ANET_SIGNATURE_KEY    — Authorize.net Signature Key (webhook verification)
#   TWILIO_AUTH_TOKEN     — optional, for Matt's SMS alerts
# All three Authorize.net values are in ~/.amedeos-authnet.env
[vars]
TO_EMAIL = "donny@pureluxbio.com, Gagliotimatt2@gmail.com"
FROM_EMAIL = "Amedeo's Private Car Service <reservations@send.pureluxbio.com>"
SITE_URL = "https://allfloridaairportscarservice.com"

# VERIFIED 2026-08-10: Matt's credentials authenticate against PRODUCTION
# only — they are rejected by the sandbox endpoint (E00007). There is no
# sandbox account for this merchant, so "production" is the only working
# value and every charge is REAL MONEY.
# Test with a $1 booking on a real card, then void it from the Merchant
# Interface (voids before nightly settlement are free and leave no trace).
ANET_ENV = "production"

# Accept.js Public Client Key. Safe in the browser AND in this repo — it is
# shipped to every visitor in the page source by design, and it can only
# tokenize a card, never charge one. This is NOT the Transaction Key, which
# is a secret and must only ever be set via `wrangler secret put`.
# Verified valid against production 2026-08-10.
ANET_PUBLIC_CLIENT_KEY = "7D49SZCsXzfefp5UTn6rDL92KfWm69cz3KcX7DJ966haufED4q76k79EK33S3gwH"

# Optional SMS to Matt. Leave blank to disable; email still goes out.
TWILIO_ACCOUNT_SID = ""
TWILIO_FROM = ""
OWNER_PHONE = ""

# Charge sweep. Every 15 minutes: charge anything that has reached T-24h.
# The window is generous on purpose — a booking made 20 hours out is
# charged on the next tick rather than being missed entirely.
[triggers]
# 0 12 * * * is the daily digest at 8am EDT / 7am EST. Its ARRIVAL is the
# heartbeat: if that email stops showing up, the scheduled jobs have died.
crons = ["*/15 * * * *", "0 12 * * *"]

# Cloudflare D1 database (the CRM store).
# Create it once with:  wrangler d1 create afacs-crm
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "afacs-crm"
database_id = "cfe69598-1d6a-4c9e-bca8-30bc37f5b4a2"
